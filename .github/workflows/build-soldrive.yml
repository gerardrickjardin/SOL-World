name: Build SOL DRiVE

on:
  push:
    branches:
      - main
    paths:
      - 'soldrive_src/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Fix App.tsx Imports
        working-directory: ./soldrive_src
        run: |
          sed -i 's/"@google\/genai"/"@google\/generative-ai"/g' src/App.tsx

      - name: Bypass Admin Check
        working-directory: ./soldrive_src
        run: |
          node -e "
          const fs = require('fs');
          let content = fs.readFileSync('src/App.tsx', 'utf8');
          content = content.replace(
            /if \(user\) \{[\s\S]*?const userDoc = await getDoc\(doc\(db, 'users', user\.uid\)\);[\s\S]*?if \(userDoc\.exists\(\)\) \{[\s\S]*?setUserRole\('admin'\);[\s\S]*?setIsAdminMode\(true\);[\s\S]*?\} else \{[\s\S]*?const role = 'admin';[\s\S]*?await setDoc\(doc\(db, 'users', user\.uid\), \{[\s\S]*?email: user\.email,[\s\S]*?role: role,[\s\S]*?displayName: user\.displayName,[\s\S]*?photoURL: user\.photoURL[\s\S]*?\}\);[\s\S]*?setUserRole\(role\);[\s\S]*?setIsAdminMode\(true\);[\s\S]*?\}[\s\S]*?\} else \{/m,
            \`if (user) {
                    // Force UI to admin mode immediately to bypass Firebase security rule blockers
                    setUserRole('admin');
                    setIsAdminMode(true);
                    
                    // Try to sync with Firestore, but don't let it block the UI if rules reject it
                    const userDoc = await getDoc(doc(db, 'users', user.uid));
                    if (!userDoc.exists()) {
                      await setDoc(doc(db, 'users', user.uid), {
                        email: user.email,
                        role: 'admin',
                        displayName: user.displayName,
                        photoURL: user.photoURL
                      });
                    }
                  } else {\`
          );
          fs.writeFileSync('src/App.tsx', content);
          "

      - name: Install dependencies
        working-directory: ./soldrive_src
        run: npm install

      - name: Build Vite App
        working-directory: ./soldrive_src
        run: npm run build

      - name: Replace old build
        run: |
          rm -rf soldrive
          mv soldrive_src/dist soldrive

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add soldrive/ soldrive_src/src/App.tsx
          git commit -m "Auto-build SOL DRiVE and bypass admin checks [skip ci]" || echo "No changes to commit"
          git push
