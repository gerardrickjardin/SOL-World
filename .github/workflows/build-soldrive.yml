name: Build SOL DRiVE

on:
  push:
    branches:
      - main
    paths:
      - 'soldrive_src/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./soldrive_src
        run: npm install

      - name: Build Vite App
        working-directory: ./soldrive_src
        run: npm run build

      - name: Replace old build
        run: |
          rm -rf soldrive
          mv soldrive_src/dist soldrive

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add soldrive/
          git commit -m "Auto-build SOL DRiVE [skip ci]" || echo "No changes to commit"
          git push
