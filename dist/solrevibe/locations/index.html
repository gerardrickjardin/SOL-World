<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOL REViBE | Locations</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', 'Inter', sans-serif;
            background: linear-gradient(180deg, #EDE6DB 0%, #EDE6DB 100%);
            color: #4A4A4A;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 3rem;
            background: rgba(247,245,241,0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(43,43,43,0.08);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, #8E9B8A, #6B7A82, #6B7A82);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        p {
            font-size: 1.1rem;
            color: #6B6B6B;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .btn-back {
            display: inline-block;
            background: linear-gradient(270deg, #22c55e, #6B7A82, #6B7A82, #6B7A82, #22c55e);
            background-size: 200% 200%;
            color: #2B2B2B;
            text-decoration: none;
            padding: 0.8rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: opacity 0.2s ease;
            box-shadow: 0 4px 14px rgba(34, 197, 94, 0.3);
        }
        .btn-back:hover {
            opacity: 0.9;
        }
    </style>
<style id="mobile-safety">
/* Mobile safety net (phones only) - additive, desktop unaffected */
@media (max-width: 600px) {
  html, body { max-width: 100%; overflow-x: hidden; -webkit-text-size-adjust: 100%; }
  img:not(.leaflet-tile):not(.leaflet-marker-icon), video, iframe { max-width: 100%; }
  img { height: auto; }
  /* 16px stops iOS Safari zooming the page when a field is focused */
  input:not([type=checkbox]):not([type=radio]):not([type=range]), select, textarea { font-size: 16px !important; min-height: 44px; }
  button, .btn, [role=button], input[type=submit] { min-height: 44px; }
  h1, h2, h3, .section-header h2, .vibe-content-section h3 { white-space: normal !important; overflow-wrap: break-word; }
  .container, .card, main { max-width: 100%; }
  table { max-width: 100%; }
  pre, code { white-space: pre-wrap; word-break: break-word; }
}
@media (max-width: 480px) {
  .container { padding: 1.5rem !important; }
  .card { padding-left: 1.25rem; padding-right: 1.25rem; }
  .topbar { padding: 10px 16px !important; }
  .topbar img { height: 44px !important; }
  main { padding-left: 1rem !important; padding-right: 1rem !important; }
}
</style>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="locations-redesign">
/* ===== Locations redesign: cream card, soft shadow, gold/sage accents (matches other pages) ===== */
html, body { background: #F3F0EA !important; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif !important; color: #2B2926; }
.page-deco { position: fixed; left: 0; bottom: 0; width: 220px; height: 150px; pointer-events: none; z-index: 0; }
.container { position: relative; z-index: 1; background: #F8F5EF !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; border: none !important; border-radius: 22px !important; box-shadow: 0 8px 36px rgba(70,58,44,0.10), 0 1px 3px rgba(70,58,44,0.06) !important; }
h1 { font-family: 'Plus Jakarta Sans', sans-serif !important; font-weight: 500 !important; color: #2B2926 !important; background: none !important; -webkit-text-fill-color: #2B2926 !important; letter-spacing: -.01em !important; }
h1 .gold { color: #C29B68; -webkit-text-fill-color: #C29B68; font-weight: 800; }
p { color: #55524D !important; }
.btn-back { background: linear-gradient(90deg, #7F9283 0%, #C29B68 100%) !important; color: #fff !important; border-radius: 999px !important; font-weight: 700 !important; box-shadow: 0 5px 16px rgba(150,130,100,0.28) !important; padding: .8rem 2rem !important; transition: filter .2s ease, transform .2s ease, box-shadow .2s ease !important; }
.btn-back:hover { opacity: 1 !important; filter: brightness(1.06); transform: translateY(-1px); box-shadow: 0 8px 22px rgba(150,130,100,0.38) !important; }
@media (max-width: 900px) { .page-deco { display: none; } }
</style>
</head>
<body>
<svg class="page-deco" viewBox="0 0 220 150" fill="none" aria-hidden="true"><path d="M-10 70 C 60 80, 110 110, 150 165" stroke="#8E9B8A" stroke-width="1.2" opacity=".55"/><path d="M-10 92 C 50 100, 90 125, 125 165" stroke="#C29B68" stroke-width="1.2" opacity=".6"/><path d="M-10 112 C 35 118, 70 138, 95 165" stroke="#8E9B8A" stroke-width="1" opacity=".4"/></svg>

    <div class="container">
        <h1><span class="gold">Locations</span></h1>
        <p>Information about our upcoming wellness stations and available licensing territories will be shared here soon.</p>
        <a href="../index.html" class="btn-back">Return Home</a>
    </div>
</body>
</html>
