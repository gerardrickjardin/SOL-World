<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Schedule Discovery Call | SOL REViBE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --sol-deep: #000814;
            --deep-navy: #0E1320;
            --sol-violet: #6C3AED;
            --revibe-magenta: #FF2F90;
            --soft-pink: #FF7AB8;
            --energy-cyan: #00E5FF;
            --light-gray: #E6E7EC;
            --white: #FFFFFF;
            --card-border: rgba(108, 58, 237, 0.35);
            --card-glow: rgba(108, 58, 237, 0.18);
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            font-family: 'Plus Jakarta Sans', 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--sol-deep);
            background-image: 
                radial-gradient(circle at 50% -10%, rgba(108, 58, 237, 0.28) 0%, transparent 55%),
                radial-gradient(circle at 100% 40%, rgba(255, 47, 144, 0.14) 0%, transparent 45%),
                radial-gradient(circle at 0% 70%, rgba(0, 229, 255, 0.12) 0%, transparent 45%);
            background-attachment: fixed;
            color: var(--white);
            letter-spacing: 0.015em;
        }

        /* Desktop layout */
        @media (min-width: 1025px) {
            body {
                min-height: 100vh;
                min-height: 100dvh;
            }

            .booking-container {
                padding: 1.5rem 1.5rem 3rem;
            }
        }

        .booking-container {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            padding: 1rem 1.25rem 2.5rem;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Bar / Mini Brand Accent */
        .top-accent-row {
            width: 100%;
            max-width: 1560px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.6rem;
            padding: 0 0.5rem;
            box-sizing: border-box;
        }

        .brand-logo-mini {
            font-size: 1.05rem;
            font-weight: 900;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--white);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .brand-logo-mini .accent {
            background: linear-gradient(135deg, var(--revibe-magenta), var(--energy-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .return-link {
            font-size: 0.8rem;
            color: #94a3b8;
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 13px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .return-link:hover {
            color: var(--energy-cyan);
            border-color: rgba(0, 229, 255, 0.35);
            background: rgba(0, 229, 255, 0.08);
            transform: translateX(2px);
        }

        /* Main Headline - with clear generous breathing space above the box */
        .headline {
            text-align: center;
            font-weight: 800;
            font-size: clamp(18px, 1.6vw, 26px);
            line-height: 1.25;
            letter-spacing: 0.02em;
            margin: 0.6rem auto 1.85rem auto;
            max-width: 1560px;
            width: 100%;
            padding: 0 1rem;
            color: var(--white);
        }

        .headline .highlight {
            background: linear-gradient(135deg, #FF2F90 0%, #FF7AB8 45%, #00E5FF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        /* Split Box Container - beautifully balanced dimensions */
        .split-box-wrapper {
            position: relative;
            width: 100%;
            max-width: 1560px;
            margin: 0 auto;
            z-index: 1;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
        }

        .split-box {
            position: relative;
            width: 100%;
            max-width: 1560px;
            margin: 0 auto;
            min-height: 660px;
            border-radius: 20px;
            overflow: hidden;
            padding: 0;
            border: 1px solid var(--card-border);
            box-shadow: 0 25px 60px rgba(0, 4, 10, 0.8), 0 0 35px var(--card-glow);
            background: linear-gradient(145deg, #0E1320 0%, #080D18 100%);
            box-sizing: border-box;
            display: flex;
        }

        .split-box-inner {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            min-height: 660px;
            display: flex;
            flex-direction: row;
            align-items: stretch;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* ==========================================================================
           LEFT PANEL: Vision Control Calendar Embed (48% width)
           ========================================================================== */
        .left-booking-panel {
            flex: 0 0 48%;
            max-width: 48%;
            min-width: 0;
            padding: 0.6rem;
            display: flex;
            flex-direction: column;
            justify-content: stretch;
            box-sizing: border-box;
            border-right: 1px solid rgba(108, 58, 237, 0.25);
            background: rgba(14, 19, 32, 0.65);
            backdrop-filter: blur(12px);
        }

        .calendar-card {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 660px;
            border-radius: 14px;
            overflow: hidden;
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }

        .calendar-card iframe {
            width: 100%;
            height: 100%;
            min-height: 660px;
            flex: 1 1 auto;
            border: none;
            display: block;
            overflow: hidden;
        }

        /* ==========================================================================
           RIGHT PANEL: Video Presentation (52% width, large & cinematic)
           ========================================================================== */
        .right-video-panel {
            flex: 0 0 52%;
            max-width: 52%;
            min-width: 0;
            padding: 1.75rem 2.25rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            background: linear-gradient(180deg, rgba(14, 19, 32, 0.4) 0%, rgba(8, 13, 24, 0.8) 100%);
            gap: 1.4rem;
            text-align: center;
        }

        .video-wrapper-inner {
            width: 100%;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        /* 16:9 Video Frame */
        .video-placeholder-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000814;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(108, 58, 237, 0.45);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(108, 58, 237, 0.22);
            transition: border-color 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .video-placeholder-frame:hover {
            border-color: rgba(0, 229, 255, 0.6);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), 0 0 40px rgba(0, 229, 255, 0.35);
        }

        .video-placeholder-frame iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            border-radius: inherit;
        }

        /* Video CTA Trigger Button - Identical to Landing Page */
        .video-cta-wrapper {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-play-trigger-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #FF2F90 0%, #6C3AED 100%);
            color: #FFFFFF;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.92rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            padding: 0.75rem 2rem;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 47, 144, 0.4), 0 0 20px rgba(108, 58, 237, 0.25);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .video-play-trigger-btn:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 10px 28px rgba(255, 47, 144, 0.55), 0 0 25px rgba(0, 229, 255, 0.4);
            border-color: rgba(0, 229, 255, 0.5);
        }

        .video-caption-text {
            font-size: 0.84rem;
            color: #94a3b8;
            max-width: 480px;
            margin: 0.25rem 0 0 0;
            line-height: 1.5;
        }

        /* ==========================================================================
           RESPONSIVE MOBILE STYLING
           ========================================================================== */
        @media (max-width: 1024px) {
            body {
                overflow-y: auto !important;
                height: auto !important;
            }

            .booking-container {
                height: auto !important;
                padding: 1rem 0.8rem 2.5rem !important;
            }

            .split-box {
                height: auto !important;
                max-height: none !important;
            }

            .split-box-inner {
                flex-direction: column;
                height: auto;
            }

            .left-booking-panel {
                flex: 1 1 100%;
                border-right: none;
                border-bottom: 1px solid rgba(108, 58, 237, 0.25);
                padding: 0.75rem;
            }

            .calendar-card {
                min-height: 640px;
            }

            .calendar-card iframe {
                min-height: 640px;
            }

            .right-video-panel {
                flex: 1 1 100%;
                padding: 2.2rem 1.2rem;
            }
        }

        @media (max-width: 600px) {
            .booking-container {
                padding: 0.8rem 0.5rem 2rem !important;
            }

            .left-booking-panel {
                padding: 0.4rem;
            }

            .calendar-card {
                min-height: 600px;
                border-radius: 10px;
            }

            .calendar-card iframe {
                min-height: 600px;
            }

            .headline {
                font-size: 18px;
                padding: 0 0.5rem;
            }
        }
    </style>
</head>

<body>

    <div class="booking-container">
        
        <!-- Top Accent Nav -->
        <div class="top-accent-row">
            <a href="/landing" class="brand-logo-mini">
                <span>SOL</span> <span class="accent">REVIBE</span>
            </a>
            <a href="/" class="return-link">
                <span>Explore Full Map &amp; Calculator</span>
                <i class="fa-solid fa-arrow-right"></i>
            </a>
        </div>

        <!-- Page Headline -->
        <h1 class="headline">
            Explore the Science &amp; Schedule Your <span class="highlight">Discovery Call</span>
        </h1>

        <!-- Main Split Box (Same box size & non-scrollable on desktop) -->
        <div class="split-box-wrapper">
            <div class="split-box">
                <div class="split-box-inner">
                    
                    <!-- LEFT PANEL: Vision Control Calendar Embed (58% width) -->
                    <div class="left-booking-panel">
                        <div class="calendar-card">
                            <iframe 
                                id="visioncontrol-calendar-iframe"
                                src="https://link.visioncontrol.io/widget/bookings/doug-cundiff-personal-calendar-cnnht4al7" 
                                style="width: 100%; height: 100%; min-height: 760px; border: none; overflow: hidden;" 
                                scrolling="no"
                                title="Book Discovery Call with Doug Cundiff">
                            </iframe>
                        </div>
                    </div>

                    <!-- RIGHT PANEL: Video Panel (42% width) -->
                    <div class="right-video-panel">
                        <div class="video-wrapper-inner">
                            <!-- 16:9 Video Frame -->
                            <div class="video-placeholder-frame">
                                <iframe 
                                    id="youtubePlayer"
                                    src="https://www.youtube.com/embed/RYwGnhl-lpU?autoplay=1&mute=1&loop=1&playsinline=1&rel=0&modestbranding=1&enablejsapi=1" 
                                    title="SOL REViBE Steak Video" 
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                                    referrerpolicy="strict-origin-when-cross-origin"
                                    allowfullscreen>
                                </iframe>
                            </div>

                            <!-- Video CTA Button -->
                            <div class="video-cta-wrapper">
                                <button type="button" class="video-play-trigger-btn" id="videoPlayTriggerBtn" aria-label="Click to Restart and Unmute">
                                    <i class="fa-solid fa-arrow-rotate-left"></i>
                                    <span>Click to Restart and Unmute</span>
                                </button>
                            </div>

                            <p class="video-caption-text">
                                Watch our in-depth walkthrough on synchronized cellular frequency recharging, clinical studies, and commercial territory ROI.
                            </p>
                        </div>
                    </div>

                </div>
            </div>
        </div>

    </div>

    <!-- Pre-fill URL query params from session storage into calendar iframe -->
    <script src="https://link.visioncontrol.io/js/form_embed.js" type="text/javascript"></script>
    <script>
        (function() {
            const iframe = document.getElementById('visioncontrol-calendar-iframe');
            if (!iframe) return;

            const baseCalendarUrl = 'https://link.visioncontrol.io/widget/bookings/doug-cundiff-personal-calendar-cnnht4al7';
            const params = new URLSearchParams();

            const firstName = sessionStorage.getItem('solrevibe_lead_firstname');
            const lastName = sessionStorage.getItem('solrevibe_lead_lastname');
            const email = sessionStorage.getItem('solrevibe_lead_email');
            const phone = sessionStorage.getItem('solrevibe_lead_phone');
            const company = sessionStorage.getItem('solrevibe_lead_company');

            if (firstName) {
                params.set('first_name', firstName);
                params.set('firstName', firstName);
            }
            if (lastName) {
                params.set('last_name', lastName);
                params.set('lastName', lastName);
            }
            if (email) params.set('email', email);
            if (phone) params.set('phone', phone);
            if (company) {
                params.set('company_name', company);
                params.set('companyName', company);
            }

            const queryString = params.toString();
            if (queryString) {
                iframe.src = `${baseCalendarUrl}?${queryString}`;
            }
        })();
    </script>

    <!-- YouTube Video Player Control (Restart & Unmute / Mute Audio) -->
    <script>
        (function() {
            const videoPlayTriggerBtn = document.getElementById('videoPlayTriggerBtn');
            const ytIframe = document.getElementById('youtubePlayer');
            let isAudioMuted = true;

            function sendYouTubeCommand(func, args = '') {
                if (ytIframe && ytIframe.contentWindow) {
                    ytIframe.contentWindow.postMessage(JSON.stringify({
                        event: 'command',
                        func: func,
                        args: args
                    }), '*');
                }
            }

            if (ytIframe) {
                ytIframe.addEventListener('load', function() {
                    ytIframe.contentWindow.postMessage(JSON.stringify({
                        event: 'listening'
                    }), '*');
                    sendYouTubeCommand('mute');
                    sendYouTubeCommand('playVideo');
                });
            }

            // Seamlessly loop video when playback ends
            window.addEventListener('message', function(e) {
                try {
                    const data = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
                    if (data && data.event === 'infoDelivery' && data.info && data.info.playerState === 0) {
                        sendYouTubeCommand('seekTo', [0, true]);
                        sendYouTubeCommand('playVideo');
                    }
                } catch (_) {}
            });

            if (videoPlayTriggerBtn) {
                videoPlayTriggerBtn.addEventListener('click', function() {
                    if (isAudioMuted) {
                        sendYouTubeCommand('seekTo', [0, true]);
                        sendYouTubeCommand('unMute');
                        sendYouTubeCommand('setVolume', [100]);
                        sendYouTubeCommand('playVideo');
                        isAudioMuted = false;
                        videoPlayTriggerBtn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i><span>Mute Audio</span>';
                    } else {
                        sendYouTubeCommand('mute');
                        isAudioMuted = true;
                        videoPlayTriggerBtn.innerHTML = '<i class="fa-solid fa-arrow-rotate-left"></i><span>Click to Restart and Unmute</span>';
                    }
                });
            }
        })();
    </script>
</body>
</html>
