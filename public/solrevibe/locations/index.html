<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOL REViBE | Locations</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', 'Inter', sans-serif;
            background: linear-gradient(180deg, #0b1329 0%, #050a16 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 3rem;
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, #31c48d, #4f7cff, #b44cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        p {
            font-size: 1.1rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .btn-back {
            display: inline-block;
            background: linear-gradient(270deg, #22c55e, #3b82f6, #a855f7, #3b82f6, #22c55e);
            background-size: 200% 200%;
            color: white;
            text-decoration: none;
            padding: 0.8rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: opacity 0.2s ease;
            box-shadow: 0 4px 14px rgba(34, 197, 94, 0.3);
        }
        .btn-back:hover {
            opacity: 0.9;
        }
    </style>
<style id="mobile-safety">
/* Mobile safety net (phones only) - additive, desktop unaffected */
@media (max-width: 600px) {
  html, body { max-width: 100%; overflow-x: hidden; -webkit-text-size-adjust: 100%; }
  img:not(.leaflet-tile):not(.leaflet-marker-icon), video, iframe { max-width: 100%; }
  img { height: auto; }
  /* 16px stops iOS Safari zooming the page when a field is focused */
  input:not([type=checkbox]):not([type=radio]):not([type=range]), select, textarea { font-size: 16px !important; min-height: 44px; }
  button, .btn, [role=button], input[type=submit] { min-height: 44px; }
  h1, h2, h3, .section-header h2, .vibe-content-section h3 { white-space: normal !important; overflow-wrap: break-word; }
  .container, .card, main { max-width: 100%; }
  table { max-width: 100%; }
  pre, code { white-space: pre-wrap; word-break: break-word; }
}
@media (max-width: 480px) {
  .container { padding: 1.5rem !important; }
  .card { padding-left: 1.25rem; padding-right: 1.25rem; }
  .topbar { padding: 10px 16px !important; }
  .topbar img { height: 44px !important; }
  main { padding-left: 1rem !important; padding-right: 1rem !important; }
}
</style>
</head>
<body>
    <div class="container">
        <h1>Locations</h1>
        <p>Information about our upcoming wellness stations and available licensing territories will be shared here soon.</p>
        <a href="../index.html" class="btn-back">Return Home</a>
    </div>
</body>
</html>
