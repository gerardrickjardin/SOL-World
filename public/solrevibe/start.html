<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experience the SOL REViBE Recharging Station</title>
    <meta name="description" content="Watch the SOL REViBE recharging station video and see how the first mind-body recharge station works.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

    <style>
        :root { --sol-deep: #000814; --sol-violet: #6C3AED; --revibe-magenta: #FF2F90; --energy-cyan: #00E5FF; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh; font-family: 'Inter', sans-serif; color: #fff; text-align: center;
            background: radial-gradient(ellipse at 15% 85%, rgba(0, 229, 255, 0.14), transparent 55%),
                        radial-gradient(ellipse at 90% 80%, rgba(255, 47, 144, 0.14), transparent 55%),
                        radial-gradient(ellipse at 50% 0%, rgba(108, 58, 237, 0.28), transparent 60%),
                        var(--sol-deep);
        }
        .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 28px; }
        .topbar img { height: 56px; display: block; }
        .back {
            color: #C9CEDB; text-decoration: none; font-size: .95rem; font-weight: 600;
            padding: 8px 16px; border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 999px; transition: all .25s ease;
        }
        .back:hover { color: #fff; border-color: var(--revibe-magenta); box-shadow: 0 0 18px rgba(255, 47, 144, 0.35); }
        main { max-width: 1200px; margin: 3rem auto 5rem; padding: 0 2rem; }
        h1 { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: clamp(1.8rem, 4.5vw, 3rem); line-height: 1.2; margin-bottom: 3rem; }
        h1 span { background: linear-gradient(135deg, #FF2F90 0%, #FF7AB8 45%, #00E5FF 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
        .video-card {
            position: relative; max-width: 960px; margin: 0 auto; aspect-ratio: 16 / 9; border-radius: 24px; overflow: hidden;
            background: linear-gradient(145deg, #0E1320 0%, #080D18 100%); border: 1px solid rgba(108, 58, 237, 0.35);
            box-shadow: 0 25px 60px rgba(0, 4, 10, 0.8), 0 0 35px rgba(108, 58, 237, 0.18);
        }
        .video-card iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; border-radius: 24px; }
    </style>
</head>
<body>
    <nav class="topbar">
        <a href="index.html" aria-label="SOL REViBE home"><img src="assets/SOL%20REViBE%20Logo.png" alt="SOL REViBE"></a>
        <a class="back" href="index.html">&larr; Back to Home</a>
    </nav>
    <main>
        <h1>Experience the <span>SOL REViBE</span> Recharging Station</h1>
        <div class="video-card" id="videoContainer">
            <iframe id="steakVideo" src="https://www.youtube.com/embed/RYwGnhl-lpU?start=16&rel=0&modestbranding=1&playsinline=1" title="SOL REViBE Recharging Station" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </main>
</body>
</html>
