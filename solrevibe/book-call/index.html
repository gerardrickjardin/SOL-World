<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Schedule Discovery Call | SOL REViBE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --sol-deep: #000814;
            --deep-navy: #0E1320;
            --sol-violet: #6C3AED;
            --revibe-magenta: #FF2F90;
            --soft-pink: #FF7AB8;
            --energy-cyan: #00E5FF;
            --light-gray: #E6E7EC;
            --white: #FFFFFF;
            --card-border: rgba(108, 58, 237, 0.35);
            --card-glow: rgba(108, 58, 237, 0.18);
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            font-family: 'Plus Jakarta Sans', 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--sol-deep);
            background-image: 
                radial-gradient(circle at 50% -10%, rgba(108, 58, 237, 0.28) 0%, transparent 55%),
                radial-gradient(circle at 100% 40%, rgba(255, 47, 144, 0.14) 0%, transparent 45%),
                radial-gradient(circle at 0% 70%, rgba(0, 229, 255, 0.12) 0%, transparent 45%);
            background-attachment: fixed;
            color: var(--white);
            letter-spacing: 0.015em;
        }

        /* Desktop: single screen viewport fit when viewport is tall enough */
        @media (min-width: 1025px) and (min-height: 820px) {
            body {
                overflow: hidden;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }

            .booking-container {
                height: 100vh;
                height: 100dvh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                padding: 0.3rem 1.5rem !important;
            }

            .split-box {
                height: clamp(770px, 88vh, 820px) !important;
            }
        }

        .booking-container {
            width: 100%;
            max-width: 1680px;
            margin: 0 auto;
            padding: 0.8rem 1.25rem 2rem;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Bar / Mini Brand Accent */
        .top-accent-row {
            width: 100%;
            max-width: 1600px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.2rem;
            padding: 0 0.5rem;
            box-sizing: border-box;
        }

        .brand-logo-mini {
            font-size: 1.05rem;
            font-weight: 900;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--white);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .brand-logo-mini .accent {
            background: linear-gradient(135deg, var(--revibe-magenta), var(--energy-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .return-link {
            font-size: 0.8rem;
            color: #94a3b8;
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 13px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .return-link:hover {
            color: var(--energy-cyan);
            border-color: rgba(0, 229, 255, 0.35);
            background: rgba(0, 229, 255, 0.08);
            transform: translateX(2px);
        }

        /* Main Headline - identical to landing page proportions */
        .headline {
            text-align: center;
            font-weight: 800;
            font-size: clamp(16px, 1.5vw, 25px);
            line-height: 1.2;
            letter-spacing: 0.02em;
            margin: 0 auto 0.4rem auto;
            max-width: 1600px;
            width: 100%;
            padding: 0 1rem;
            color: var(--white);
        }

        .headline .highlight {
            background: linear-gradient(135deg, #FF2F90 0%, #FF7AB8 45%, #00E5FF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        /* Split Box Container - exact same width & style as landing page */
        .split-box-wrapper {
            position: relative;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            z-index: 1;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
        }

        .split-box {
            position: relative;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            min-height: 780px;
            border-radius: 20px;
            overflow: hidden;
            padding: 0;
            border: 1px solid var(--card-border);
            box-shadow: 0 25px 60px rgba(0, 4, 10, 0.8), 0 0 35px var(--card-glow);
            background: linear-gradient(145deg, #0E1320 0%, #080D18 100%);
            box-sizing: border-box;
            display: flex;
        }

        .split-box-inner {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            min-height: 780px;
            display: flex;
            flex-direction: row;
            align-items: stretch;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* ==========================================================================
           LEFT PANEL: Vision Control Calendar Embed (58% width for side-by-side view)
           ========================================================================== */
        .left-booking-panel {
            flex: 0 0 58%;
            min-width: 0;
            padding: 0.85rem;
            display: flex;
            flex-direction: column;
            justify-content: stretch;
            box-sizing: border-box;
            border-right: 1px solid rgba(108, 58, 237, 0.25);
            background: rgba(14, 19, 32, 0.65);
            backdrop-filter: blur(12px);
        }

        .calendar-card {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 760px;
            border-radius: 14px;
            overflow: hidden;
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }

        .calendar-card iframe {
            width: 100%;
            height: 100%;
            min-height: 760px;
            flex: 1 1 auto;
            border: none;
            display: block;
            overflow: hidden;
        }

        /* ==========================================================================
           RIGHT PANEL: Video Placeholder (42% width, cleanly centered)
           ========================================================================== */
        .right-video-panel {
            flex: 0 0 42%;
            min-width: 0;
            padding: 2rem 2.2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            background: linear-gradient(180deg, rgba(14, 19, 32, 0.4) 0%, rgba(8, 13, 24, 0.8) 100%);
            gap: 1.25rem;
            text-align: center;
        }

        .video-wrapper-inner {
            width: 100%;
            max-width: 580px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        /* 16:9 Video Placeholder Frame - Matches Landing Page Video Style */
        .video-placeholder-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000814;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(108, 58, 237, 0.45);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(108, 58, 237, 0.22);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        .video-placeholder-frame:hover {
            transform: translateY(-2px);
            border-color: rgba(0, 229, 255, 0.6);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), 0 0 40px rgba(0, 229, 255, 0.35);
        }

        .video-bg-art {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 50% 50%, rgba(108, 58, 237, 0.28) 0%, rgba(0, 8, 20, 0.96) 75%),
                radial-gradient(circle at 85% 20%, rgba(255, 47, 144, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 15% 80%, rgba(0, 229, 255, 0.18) 0%, transparent 50%);
            z-index: 1;
        }

        .video-overlay-elements {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 1.5rem;
        }

        .video-tag-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 14px;
            border-radius: 9999px;
            background: rgba(0, 229, 255, 0.12);
            border: 1px solid rgba(0, 229, 255, 0.35);
            color: var(--energy-cyan);
            font-size: 0.74rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .video-play-button {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--revibe-magenta) 0%, var(--sol-violet) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.85rem;
            color: #ffffff;
            padding-left: 5px;
            box-shadow: 0 0 35px rgba(255, 47, 144, 0.65), 0 0 70px rgba(108, 58, 237, 0.35);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease;
        }

        .video-placeholder-frame:hover .video-play-button {
            transform: scale(1.08);
            box-shadow: 0 0 45px rgba(255, 47, 144, 0.85), 0 0 90px rgba(108, 58, 237, 0.55);
        }

        .video-duration-badge {
            font-size: 0.78rem;
            color: #cbd5e1;
            font-weight: 600;
            letter-spacing: 0.04em;
        }

        /* Video CTA Trigger Button - Identical to Landing Page */
        .video-cta-wrapper {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-play-trigger-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #FF2F90 0%, #6C3AED 100%);
            color: #FFFFFF;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.92rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            padding: 0.75rem 2rem;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 47, 144, 0.4), 0 0 20px rgba(108, 58, 237, 0.25);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .video-play-trigger-btn:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 10px 28px rgba(255, 47, 144, 0.55), 0 0 25px rgba(0, 229, 255, 0.4);
            border-color: rgba(0, 229, 255, 0.5);
        }

        .video-caption-text {
            font-size: 0.84rem;
            color: #94a3b8;
            max-width: 480px;
            margin: 0.25rem 0 0 0;
            line-height: 1.5;
        }

        /* ==========================================================================
           RESPONSIVE MOBILE STYLING
           ========================================================================== */
        @media (max-width: 1024px) {
            body {
                overflow-y: auto !important;
                height: auto !important;
            }

            .booking-container {
                height: auto !important;
                padding: 1rem 0.8rem 2.5rem !important;
            }

            .split-box {
                height: auto !important;
                max-height: none !important;
            }

            .split-box-inner {
                flex-direction: column;
                height: auto;
            }

            .left-booking-panel {
                flex: 1 1 100%;
                border-right: none;
                border-bottom: 1px solid rgba(108, 58, 237, 0.25);
                padding: 0.75rem;
            }

            .calendar-card {
                min-height: 640px;
            }

            .calendar-card iframe {
                min-height: 640px;
            }

            .right-video-panel {
                flex: 1 1 100%;
                padding: 2.2rem 1.2rem;
            }
        }

        @media (max-width: 600px) {
            .booking-container {
                padding: 0.8rem 0.5rem 2rem !important;
            }

            .left-booking-panel {
                padding: 0.4rem;
            }

            .calendar-card {
                min-height: 600px;
                border-radius: 10px;
            }

            .calendar-card iframe {
                min-height: 600px;
            }

            .headline {
                font-size: 18px;
                padding: 0 0.5rem;
            }
        }
    </style>
</head>

<body>

    <div class="booking-container">
        
        <!-- Top Accent Nav -->
        <div class="top-accent-row">
            <a href="/landing" class="brand-logo-mini">
                <span>SOL</span> <span class="accent">REVIBE</span>
            </a>
            <a href="/" class="return-link">
                <span>Explore Full Map &amp; Calculator</span>
                <i class="fa-solid fa-arrow-right"></i>
            </a>
        </div>

        <!-- Page Headline -->
        <h1 class="headline">
            Explore the Science &amp; Schedule Your <span class="highlight">Discovery Call</span>
        </h1>

        <!-- Main Split Box (Same box size & non-scrollable on desktop) -->
        <div class="split-box-wrapper">
            <div class="split-box">
                <div class="split-box-inner">
                    
                    <!-- LEFT PANEL: Vision Control Calendar Embed (58% width) -->
                    <div class="left-booking-panel">
                        <div class="calendar-card">
                            <iframe 
                                id="visioncontrol-calendar-iframe"
                                src="https://link.visioncontrol.io/widget/bookings/doug-cundiff-personal-calendar-cnnht4al7" 
                                style="width: 100%; height: 100%; min-height: 760px; border: none; overflow: hidden;" 
                                scrolling="no"
                                title="Book Discovery Call with Doug Cundiff">
                            </iframe>
                        </div>
                    </div>

                    <!-- RIGHT PANEL: Video Placeholder (42% width) -->
                    <div class="right-video-panel">
                        <div class="video-wrapper-inner">
                            <!-- 16:9 Video Placeholder Frame -->
                            <div class="video-placeholder-frame" role="button" aria-label="Play presentation video placeholder">
                                <div class="video-bg-art"></div>
                                <div class="video-overlay-elements">
                                    <div class="video-tag-pill">
                                        <i class="fa-solid fa-play-circle"></i> Executive Presentation
                                    </div>
                                    <div class="video-play-button">
                                        <i class="fa-solid fa-play"></i>
                                    </div>
                                    <div class="video-duration-badge">
                                        <i class="fa-solid fa-circle" style="font-size: 0.5rem; color: #00E5FF; margin-right: 4px;"></i> 12:45 • 4K UHD Master
                                    </div>
                                </div>
                            </div>

                            <!-- Video CTA Button -->
                            <div class="video-cta-wrapper">
                                <button type="button" class="video-play-trigger-btn" id="videoPlayTriggerBtn" aria-label="Executive Briefing Video">
                                    <i class="fa-solid fa-play"></i>
                                    <span>Watch Executive Briefing</span>
                                </button>
                            </div>

                            <p class="video-caption-text">
                                Watch our in-depth walkthrough on synchronized cellular frequency recharging, clinical studies, and commercial territory ROI.
                            </p>
                        </div>
                    </div>

                </div>
            </div>
        </div>

    </div>

    <!-- Pre-fill URL query params from session storage into calendar iframe -->
    <script src="https://link.visioncontrol.io/js/form_embed.js" type="text/javascript"></script>
    <script>
        (function() {
            const iframe = document.getElementById('visioncontrol-calendar-iframe');
            if (!iframe) return;

            const baseCalendarUrl = 'https://link.visioncontrol.io/widget/bookings/doug-cundiff-personal-calendar-cnnht4al7';
            const params = new URLSearchParams();

            const firstName = sessionStorage.getItem('solrevibe_lead_firstname');
            const lastName = sessionStorage.getItem('solrevibe_lead_lastname');
            const email = sessionStorage.getItem('solrevibe_lead_email');
            const phone = sessionStorage.getItem('solrevibe_lead_phone');
            const company = sessionStorage.getItem('solrevibe_lead_company');

            if (firstName) {
                params.set('first_name', firstName);
                params.set('firstName', firstName);
            }
            if (lastName) {
                params.set('last_name', lastName);
                params.set('lastName', lastName);
            }
            if (email) params.set('email', email);
            if (phone) params.set('phone', phone);
            if (company) {
                params.set('company_name', company);
                params.set('companyName', company);
            }

            const queryString = params.toString();
            if (queryString) {
                iframe.src = `${baseCalendarUrl}?${queryString}`;
            }
        })();
    </script>
</body>
</html>
