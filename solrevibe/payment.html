<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment | SOL REViBE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --accent-emerald: #10b981;
            --accent-purple: #a855f7;
            --text-primary: #1f2937;
            --text-secondary: #4b5563;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.4);
            --font-heading: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: linear-gradient(135deg, #ebf7eb 0%, #faf2e6 25%, #fbf1e6 50%, #e9edfa 75%, #ebf7eb 100%);
            background-size: 400% 400%;
            animation: gradientFlow 15s ease infinite;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            padding: 2rem;
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .payment-container {
            width: 100%;
            max-width: 500px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            text-align: center;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-container {
            margin-bottom: 2rem;
        }

        .logo-container img {
            height: 40px;
            margin-bottom: 1rem;
        }

        h1 {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #10b981, #3b82f6, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }

        p {
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 2.5rem;
            font-size: 1.1rem;
        }

        .payment-status {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent-emerald);
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .placeholder-card {
            background: rgba(0, 0, 0, 0.03);
            border: 2px dashed rgba(0, 0, 0, 0.1);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .input-row {
            height: 40px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            width: 100%;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .primary-btn {
            background: linear-gradient(to right, #22c55e, #3b82f6, #a855f7);
            background-size: 200% auto;
            color: white;
            padding: 1rem 2rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: 0.3s ease;
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.2);
            border: none;
            cursor: pointer;
        }

        .primary-btn:hover {
            background-position: right center;
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(59, 130, 246, 0.3);
        }

        .secondary-btn {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .secondary-btn:hover {
            color: var(--text-primary);
        }

        .secure-badge {
            margin-top: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: #94a3b8;
        }

        @media (max-width: 480px) {
            .payment-container {
                padding: 2rem;
            }
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <div class="payment-container">
        <div class="logo-container">
            <img src="assets/SOL REViBE Logo.png" alt="SOL REViBE">
        </div>

        <div class="payment-status">
            <i class="fas fa-shield-alt"></i>
            Secure Checkout
        </div>

        <h1>Payment</h1>
        
        <p>Complete your frequency recharging journey. Your session is held for the next 15 minutes.</p>

        <div class="placeholder-card">
            <div class="input-row" style="width: 100%;"></div>
            <div style="display: flex; gap: 1rem;">
                <div class="input-row" style="width: 70%;"></div>
                <div class="input-row" style="width: 30%;"></div>
            </div>
        </div>

        <div class="btn-container">
            <button class="primary-btn">Pay Now</button>
            <a href="index.html" class="secondary-btn">
                <i class="fas fa-arrow-left"></i> Return to Main Site
            </a>
        </div>

        <div class="secure-badge">
            <i class="fas fa-lock"></i>
            SSL Encrypted & Secure Payment Processing
        </div>
    </div>

</body>
</html>
