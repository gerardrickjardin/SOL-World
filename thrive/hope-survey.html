    // FLEX SLOTS
    {

];

const App = () => {
    const [step, setStep] = useState('intro'); // 'intro', 'survey', 'results'
    const [currentQIndex, setCurrentQIndex] = useState(0);
    const [answers, setAnswers] = useState({}); // { id: score }
    const [currentSelection, setCurrentSelection] = useState(null);

    const handleNextQ = () => {
        const qId = surveyQuestions[currentQIndex].id;
        const newAnswers = { ...answers, [qId]: currentSelection !== null ? currentSelection : 2.5 };
        setAnswers(newAnswers);
        
        if (currentQIndex < surveyQuestions.length - 1) {
            setCurrentQIndex(currentQIndex + 1);
            setCurrentSelection(newAnswers[surveyQuestions[currentQIndex + 1].id] ?? 2.5);
            window.scrollTo(0,0);
        } else {
            setStep('results');
            window.scrollTo(0,0);
        }
    };

    const handlePrevQ = () => {
        if (currentQIndex > 0) {
            setCurrentQIndex(currentQIndex - 1);
            setCurrentSelection(answers[surveyQuestions[currentQIndex - 1].id] ?? 2.5);
            window.scrollTo(0,0);
        } else {
            setStep('intro');
        }
    };

    // --- RATING COMPONENT ---
    const renderRater = () => {
        const values = [0.0, 0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0];
        
        return (
            <div className="mt-8">
                <div className="flex justify-between px-2 mb-2 text-xs font-bold text-slate-400">
                    <span>0.0 (Suboptimal)</span>
                    <span>2.5 (Neutral)</span>
                    <span>5.0 (Optimal)</span>
                </div>
                
                {/* Visual Anchor Descriptions */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                    <div className="bg-red-50 border border-red-100 p-4 rounded-xl text-[13px] text-red-800 shadow-sm leading-relaxed">
                        <span className="font-bold block mb-1">⭐ 0.0 Stars</span>
                        {surveyQuestions[currentQIndex].anchors[0.0]}
                    </div>
                    <div className="bg-amber-50 border border-amber-100 p-4 rounded-xl text-[13px] text-amber-800 shadow-sm leading-relaxed">
                        <span className="font-bold block mb-1">⭐⭐✨ 2.5 Stars</span>
                        {surveyQuestions[currentQIndex].anchors[2.5]}
                    </div>
                    <div className="bg-emerald-50 border border-emerald-100 p-4 rounded-xl text-[13px] text-emerald-800 shadow-sm leading-relaxed">
                        <span className="font-bold block mb-1">⭐⭐⭐⭐⭐ 5.0 Stars</span>
                        {surveyQuestions[currentQIndex].anchors[5.0]}
                    </div>
                </div>

                <div className="relative pt-6 pb-8 px-4 md:px-8 bg-slate-50 border border-slate-200 rounded-3xl mt-8">
                    <input 
                        type="range" 
                        min="0" max="5" step="0.5"
                        value={currentSelection !== null ? currentSelection : 2.5}
                        onChange={(e) => setCurrentSelection(parseFloat(e.target.value))}
                        className="w-full h-3 bg-slate-300 rounded-lg appearance-none cursor-pointer outline-none shadow-inner"
                        style={{
                            background: `linear-gradient(to right, #ef4444 0%, #f59e0b 50%, #10b981 100%)`
                        }}
                    />
                    <div className="flex justify-between mt-5">
                        {values.map(val => (
                            <div 
                                key={val} 
                                onClick={() => setCurrentSelection(val)}
                                className={`flex flex-col items-center cursor-pointer group`}
                            >
                                <div className={`w-1.5 rounded-full mb-1 ${val % 1 === 0 ? 'bg-slate-400 h-4' : 'bg-slate-300 h-2'} group-hover:bg-blue-600 transition-colors`}></div>
                                <span className={`text-[11px] md:text-sm font-bold ${currentSelection === val ? 'text-blue-600 scale-125' : 'text-slate-500'} transition-all`}>
                                    {val.toFixed(1)}
                                </span>
                            </div>
                        ))}
                    </div>
                    
                    <div className="mt-8 text-center bg-white p-6 rounded-2xl border-2 border-blue-100 shadow-md transform transition-all duration-300 scale-100 max-w-sm mx-auto">
                        <span className="text-slate-500 text-sm font-bold uppercase tracking-widest block mb-1">Your Rating</span>
                        <span className="text-5xl font-black text-blue-600 flex items-center justify-center gap-3">
                            {(currentSelection !== null ? currentSelection : 2.5).toFixed(1)} 
                            <span className="text-3xl text-yellow-400" style={{ filter: 'drop-shadow(0 2px 4px rgba(250, 204, 21, 0.4))' }}>★</span>
                        </span>
                    </div>
                </div>
            </div>
        );
    };

    // --- INTRO SCREEN ---
    if (step === 'intro') {
        return (
            <main className="flex-grow flex flex-col items-center justify-center p-6 mt-8">
                <div className="bg-white max-w-3xl w-full p-8 md:p-12 rounded-[2rem] shadow-2xl border border-slate-100 text-center relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-emerald-500 via-blue-500 to-purple-500"></div>
                    <h1 className="text-5xl font-black text-slate-800 mb-6 tracking-tight">The HoPE Index</h1>
                    <h2 className="text-xl font-bold text-slate-500 mb-8 uppercase tracking-widest">Human Optimal Personal Experience</h2>
                    
                    <div className="text-left space-y-6 text-slate-600 text-lg leading-relaxed mb-10">
                        <p>Welcome to the HoPE Index Survey. This is not a test, an academic exam, or a clinical trial designed to diagnose your flaws. It is an innovative, highly visual platform designed to map where you are today and provide a clear, actionable guide toward a life of true optimization and stability.</p>
                        
                        <div className="bg-blue-50 border border-blue-100 p-6 rounded-2xl shadow-sm">
                            <h3 className="font-bold text-blue-900 mb-2 flex items-center gap-2">
                                <span className="text-xl">💡</span> How to Complete this Survey
                            </h3>
                            <p className="text-base text-blue-800">Imagine you are a professional critic writing a review for a hotel or an app. You are not rating your worth as a human being. Instead, you are rating the quality of the experience currently provided by the different "facilities" and "services" in your life.</p>
                        </div>
                    </div>

                    <button 
                        onClick={() => { setStep('survey'); setCurrentSelection(answers[surveyQuestions[0].id] ?? 2.5); }}
                        className="bg-gradient-to-r from-blue-600 to-purple-600 text-white px-10 py-5 rounded-full font-bold text-xl hover:-translate-y-1 transition-all shadow-xl hover:shadow-[0_10px_25px_rgba(79,70,229,0.4)] inline-flex items-center justify-center gap-3 w-full md:w-auto"
                    >
                        Begin Assessment →
                    </button>
                </div>
            </main>
        );
    }

    // --- RESULTS SCREEN ---
    if (step === 'results') {
        const totalScore = Object.values(answers).reduce((a, b) => a + b, 0); // Out of 100 max
        
        // Define polar-to-cartesian and arc generator for React SVG
        const polarToCartesian = (centerX, centerY, radius, angleInDegrees) => {
            const angleInRadians = (angleInDegrees - 90) * Math.PI / 180.0;
            return {
                x: centerX + (radius * Math.cos(angleInRadians)),
                y: centerY + (radius * Math.sin(angleInRadians))
            };
        };

        const describeArc = (x, y, innerRadius, outerRadius, startAngle, endAngle) => {
            const startOut = polarToCartesian(x, y, outerRadius, endAngle);
            const endOut = polarToCartesian(x, y, outerRadius, startAngle);
            const startIn = polarToCartesian(x, y, innerRadius, endAngle);
            const endIn = polarToCartesian(x, y, innerRadius, startAngle);
            const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
            return [
                "M", startOut.x, startOut.y,
                "A", outerRadius, outerRadius, 0, largeArcFlag, 0, endOut.x, endOut.y,
                "L", endIn.x, endIn.y,
                "A", innerRadius, innerRadius, 0, largeArcFlag, 1, startIn.x, startIn.y,
                "Z"
            ].join(" ");
        };

        // Base constants for the visual
        const cx = 500;
        const cy = 400; // Center of the arc
        const innerR = 200;
        const maxOutR = 350; // max radius for a score of 5.0
        
        const dimensionColors = [
            '#ff3b30', // Places
            '#ff9500', // Body
            '#ffcc00', // Resources
            '#34c759', // Self
            '#007aff', // Others
            '#af52de'  // Life
        ];
        const dimensionNames = ["PLACES", "BODY", "RESOURCES", "SELF", "OTHERS", "LIFE"];

        // We have 18 core questions. Angles from -90 to 90.
        const coreQuestions = surveyQuestions.slice(0, 18);
        const flex1Score = answers[surveyQuestions[18].id] ?? 0;
        const flex2Score = answers[surveyQuestions[19].id] ?? 0;

        return (
            <main className="flex-grow flex items-center justify-center bg-[#050a15] p-4 md:p-8 relative w-full overflow-hidden min-h-screen">
                {/* Cyber Background Grid & Effects */}
                <div className="absolute inset-0 pointer-events-none" style={{
                    backgroundImage: 'linear-gradient(rgba(0, 242, 254, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 242, 254, 0.05) 1px, transparent 1px)',
                    backgroundSize: '40px 40px',
                    backgroundPosition: 'center center'
                }}></div>
                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-cyan-500 rounded-full blur-[200px] opacity-[0.07] pointer-events-none"></div>
                
                <div className="relative z-10 w-full max-w-[1000px] rounded-[30px] border border-cyan-500/30 bg-[#0a1122]/90 backdrop-blur-xl shadow-[0_0_50px_rgba(0,242,254,0.1)] p-8 md:p-12">
                    
                    {/* Header */}
                    <div className="text-center mb-10">
                        <h1 className="text-3xl md:text-4xl font-black text-white tracking-widest mb-2 drop-shadow-[0_0_10px_rgba(255,255,255,0.5)]">THE HOPE INDEX <span className="text-cyan-400 font-light text-xl">(Human Optimized Personal Experience)</span></h1>
                        <p className="text-cyan-200/60 text-sm tracking-widest uppercase">Baseline & Post-Intervention Resilience Assessment</p>
                    </div>

                    {/* SVG Visualization Area */}
                    <div className="relative w-full aspect-[2/1.3]">
                        <svg viewBox="0 0 1000 650" className="w-full h-full drop-shadow-2xl overflow-visible">
                            <defs>
                                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                                    <feGaussianBlur stdDeviation="4" result="blur" />
                                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                                </filter>
                                <filter id="glow-strong" x="-20%" y="-20%" width="140%" height="140%">
                                    <feGaussianBlur stdDeviation="8" result="blur" />
                                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                                </filter>
                            </defs>

                            {/* Dimension Labels & Outer Arcs */}
                            {dimensionNames.map((name, i) => {
                                const startA = -90 + (i * 30);
                                const endA = startA + 30;
                                const midA = startA + 15;
                                const labelPos = polarToCartesian(cx, cy, maxOutR + 40, midA);
                                const color = dimensionColors[i];
                                return (
                                    <g key={`dim-${i}`}>
                                        <path d={describeArc(cx, cy, maxOutR + 10, maxOutR + 15, startA + 1, endA - 1)} fill={color} opacity="0.3" />
                                        <text x={labelPos.x} y={labelPos.y} fill={color} fontSize="14" fontWeight="bold" textAnchor="middle" alignmentBaseline="middle" style={{ transform: `rotate(${midA}deg)`, transformOrigin: `${labelPos.x}px ${labelPos.y}px`, letterSpacing: '2px' }}>{name}</text>
                                    </g>
                                );
                            })}

                            {/* Circuit traces (background lines to center) */}
                            {coreQuestions.map((_, i) => {
                                const angle = -90 + (i * 10) + 5; // mid point of wedge
                                const start = polarToCartesian(cx, cy, innerR - 5, angle);
                                const destX = cx + (i - 8.5) * 15; // distribute along the top of the center box
                                const destY = cy + 40;
                                return (
                                    <path key={`trace-${i}`} d={`M ${start.x} ${start.y} Q ${cx} ${cy} ${destX} ${destY}`} fill="none" stroke="#00f2fe" strokeWidth="1" opacity="0.4" />
                                );
                            })}

                            {/* 18 Data Slices */}
                            {coreQuestions.map((q, i) => {
                                const score = answers[q.id] ?? 0;
                                const dimIndex = Math.floor(i / 3);
                                const color = dimensionColors[dimIndex];
                                const startA = -90 + (i * 10);
                                const endA = startA + 9.5; // leaving 0.5 gap
                                
                                // Calculate outer radius based on score (0 to 5 maps to innerR to maxOutR)
                                const scoreR = innerR + (score / 5) * (maxOutR - innerR);
                                
                                // Base empty track
                                const basePath = describeArc(cx, cy, innerR, maxOutR, startA, endA);
                                // Filled score track
                                const scorePath = describeArc(cx, cy, innerR, scoreR, startA, endA);

                                return (
                                    <g key={`slice-${i}`}>
                                        <path d={basePath} fill={color} opacity="0.1" />
                                        <path d={scorePath} fill={color} filter="url(#glow)" opacity="0.9" />
                                        
                                        {/* Number Label */}
                                        <text 
                                            {...polarToCartesian(cx, cy, innerR - 20, startA + 4.75)} 
                                            fill="#ffffff" fontSize="12" fontWeight="bold" textAnchor="middle" opacity="0.7"
                                        >{i + 1}</text>
                                    </g>
                                );
                            })}

                            {/* Central Box for Total Score */}
                            <g transform={`translate(${cx - 150}, ${cy + 60})`}>
                                {/* Glowing Box Background */}
                                <rect x="0" y="0" width="300" height="90" rx="10" fill="#050a15" stroke="#00f2fe" strokeWidth="2" filter="url(#glow)" />
                                <rect x="0" y="0" width="300" height="90" rx="10" fill="rgba(0, 242, 254, 0.05)" />
                                
                                <text x="150" y="35" fill="#ffffff" fontSize="18" fontWeight="bold" textAnchor="middle" letterSpacing="1px">TOTAL HOPE INDEX SCORE</text>
                                <text x="150" y="55" fill="#00f2fe" fontSize="14" fontWeight="normal" textAnchor="middle" opacity="0.8">(0-100%)</text>
                                
                                <text x="150" y="140" fill="#ffffff" fontSize="64" fontWeight="900" textAnchor="middle" filter="url(#glow-strong)" style={{ textShadow: '0 0 20px #00f2fe' }}>{totalScore}</text>
                                <text x="215" y="140" fill="#00f2fe" fontSize="24" fontWeight="bold" textAnchor="start" opacity="0.7">/100</text>
                            </g>
                            
                            {/* Circuit lines from central box down to bottom module */}
                            <path d={`M ${cx - 60} ${cy + 170} L ${cx - 60} ${cy + 220} L ${cx - 200} ${cy + 220} L ${cx - 200} ${cy + 250}`} fill="none" stroke="#00f2fe" strokeWidth="2" opacity="0.6" filter="url(#glow)" />
                            <path d={`M ${cx + 60} ${cy + 170} L ${cx + 60} ${cy + 220} L ${cx + 200} ${cy + 220} L ${cx + 200} ${cy + 250}`} fill="none" stroke="#00f2fe" strokeWidth="2" opacity="0.6" filter="url(#glow)" />
                        </svg>
                    </div>

                    {/* Population-Specific Context (Flexible Module) */}
                    <div className="mt-8 border border-cyan-500/40 rounded-[20px] bg-[#050a15]/80 p-6 relative">
                        {/* Corner Accents */}
                        <div className="absolute top-0 left-0 w-8 h-8 border-t-2 border-l-2 border-cyan-400 rounded-tl-[20px]"></div>
                        <div className="absolute top-0 right-0 w-8 h-8 border-t-2 border-r-2 border-cyan-400 rounded-tr-[20px]"></div>
                        <div className="absolute bottom-0 left-0 w-8 h-8 border-b-2 border-l-2 border-cyan-400 rounded-bl-[20px]"></div>
                        <div className="absolute bottom-0 right-0 w-8 h-8 border-b-2 border-r-2 border-cyan-400 rounded-br-[20px]"></div>
                        
                        <div className="absolute -top-3 left-1/2 -translate-x-1/2 bg-[#0a1122] px-4 text-cyan-400 text-sm font-bold tracking-widest uppercase border border-cyan-500/40 rounded-full shadow-[0_0_10px_rgba(0,242,254,0.3)]">
                            Population-Specific Context
                        </div>
                        <div className="absolute -bottom-2 left-1/2 -translate-x-1/2 text-cyan-500/60 text-xs uppercase tracking-widest bg-[#050a15] px-2">
                            (Flexible Module)
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8 pt-4 pb-2">
                            {/* Gauge 1 */}
                            <div className="flex items-center gap-6 justify-center">
                                <div className="relative w-24 h-24">
                                    <svg viewBox="0 0 100 100" className="w-full h-full drop-shadow-[0_0_10px_rgba(0,242,254,0.5)]">
                                        <path d={describeArc(50, 50, 40, 45, -120, 120)} fill="#1e293b" />
                                        <path d={describeArc(50, 50, 40, 45, -120, -120 + (flex1Score / 5) * 240)} fill="#00f2fe" />
                                        {/* Needle */}
                                        <g style={{ transform: `rotate(${-120 + (flex1Score / 5) * 240}deg)`, transformOrigin: '50px 50px', transition: 'transform 1s ease-out' }}>
                                            <polygon points="48,50 52,50 50,15" fill="#ffffff" />
                                            <circle cx="50" cy="50" r="4" fill="#00f2fe" />
                                        </g>
                                    </svg>
                                    <div className="absolute bottom-0 left-1/2 -translate-x-1/2 text-cyan-400 font-bold text-sm">0-5</div>
                                </div>
                                <div>
                                    <div className="text-cyan-500/80 text-xs font-bold tracking-wider mb-1">Question A:</div>
                                    <h3 className="text-white font-bold text-lg leading-tight mb-1">GANG DE-IDENTIFICATION (ICA)</h3>
                                    <p className="text-slate-400 text-xs">(measures disengagement/identity shift)</p>
                                </div>
                            </div>

                            {/* Gauge 2 */}
                            <div className="flex items-center gap-6 justify-center">
                                <div className="relative w-24 h-24">
                                    <svg viewBox="0 0 100 100" className="w-full h-full drop-shadow-[0_0_10px_rgba(0,242,254,0.5)]">
                                        <path d={describeArc(50, 50, 40, 45, -120, 120)} fill="#1e293b" />
                                        <path d={describeArc(50, 50, 40, 45, -120, -120 + (flex2Score / 5) * 240)} fill="#00f2fe" />
                                        {/* Needle */}
                                        <g style={{ transform: `rotate(${-120 + (flex2Score / 5) * 240}deg)`, transformOrigin: '50px 50px', transition: 'transform 1s ease-out' }}>
                                            <polygon points="48,50 52,50 50,15" fill="#ffffff" />
                                            <circle cx="50" cy="50" r="4" fill="#00f2fe" />
                                        </g>
                                    </svg>
                                    <div className="absolute bottom-0 left-1/2 -translate-x-1/2 text-cyan-400 font-bold text-sm">0-5</div>
                                </div>
                                <div>
                                    <div className="text-cyan-500/80 text-xs font-bold tracking-wider mb-1">Question B:</div>
                                    <h3 className="text-white font-bold text-lg leading-tight mb-1">PSYCHOLOGICAL SAFETY</h3>
                                    <p className="text-slate-400 text-xs">(measures reduced fear)</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Action Buttons */}
                    <div className="flex gap-4 mt-10">
                        <button onClick={() => window.print()} className="flex-1 bg-transparent border border-cyan-500 text-cyan-400 font-bold py-4 rounded-full hover:bg-cyan-900/30 transition-colors shadow-[0_0_15px_rgba(0,242,254,0.2)]">
                            Export PDF Report
                        </button>
                        <button onClick={() => window.location.reload()} className="flex-1 bg-cyan-500 text-[#050a15] font-black py-4 rounded-full hover:bg-cyan-400 transition-colors shadow-[0_0_20px_rgba(0,242,254,0.5)]">
                            Retake Assessment
                        </button>
                    </div>

                </div>
            </main>
        );
    }

    // --- SURVEY SCREEN ---
    const q = surveyQuestions[currentQIndex];
    const progress = ((currentQIndex) / surveyQuestions.length) * 100; // Progress starts at 0

    return (
        <main className="flex-grow p-4 md:p-8 flex flex-col items-center">
            
            <div className="w-full max-w-4xl mb-10">
                <div className="flex justify-between items-end text-sm font-bold text-slate-500 mb-3">
                    <span className="uppercase tracking-widest text-xs">Survey Progress</span>
                    <span className="bg-white px-3 py-1 rounded-full shadow-sm border border-slate-100 text-blue-600">{currentQIndex + 1} / {surveyQuestions.length}</span>
                </div>
                <div className="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden shadow-inner">
                    <div className="bg-gradient-to-r from-emerald-400 via-blue-500 to-purple-500 h-full transition-all duration-700 ease-in-out" style={{ width: `${progress}%` }}></div>
                </div>
            </div>

            <div className="bg-white max-w-4xl w-full p-8 md:p-12 rounded-[2rem] shadow-2xl border border-slate-100 relative">
                
                <div className="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 pb-6 border-b border-slate-100 gap-4">
                    <div>
                        <div className="inline-block bg-blue-50 text-blue-700 px-3 py-1 rounded-lg font-bold uppercase tracking-widest text-[10px] mb-3 border border-blue-100">{q.space}</div>
                        <div className="text-slate-400 font-bold text-sm tracking-wide">{q.dimension}</div>
                    </div>
                </div>

                <h2 className="text-4xl font-black text-slate-800 mb-6 tracking-tight leading-tight">{q.title}</h2>
                <div className="bg-slate-50 border-l-4 border-blue-500 p-6 rounded-r-2xl mb-10">
                    <p className="text-xl text-slate-700 leading-relaxed font-medium">{q.concept}</p>
                </div>
                
                {renderRater()}

                <div className="flex justify-between items-center mt-12 pt-8 border-t border-slate-100">
                    <button 
                        onClick={handlePrevQ}
                        className={`text-slate-500 font-bold hover:text-slate-800 px-6 py-3 transition-colors flex items-center gap-2 ${currentQIndex === 0 ? 'invisible' : ''}`}
                    >
                        <span>←</span> Back
                    </button>
                    <button 
                        onClick={handleNextQ}
                        className={`px-10 py-4 rounded-full font-bold text-lg transition-all flex items-center gap-3 bg-gradient-to-r from-blue-600 to-purple-600 text-white hover:-translate-y-1 hover:shadow-[0_10px_25px_rgba(79,70,229,0.4)] cursor-pointer shadow-lg`}
                    >
                        {currentQIndex === surveyQuestions.length - 1 ? 'Generate Index Map 🚀' : 'Next Question →'}
                    </button>
                </div>
            </div>
            
        </main>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
    </script>
</body>
</html>
